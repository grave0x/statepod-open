[package]
name = "swarmtui"
version = "0.1.0-dev"
edition = "2021"
description = "Swarmstate orchestrator/management TUI"
license = "MIT"

[lib]
name = "swarmtui"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ratatui = "0.29"
crossterm = "0.28"

[[example]]
name = "wireframe_dump"
path = "examples/wireframe_dump.rs"

